[project]
name = "camera-bench"
version = "0.1.0"
description = "Field measurements for camera-calc: stream bitrate, NVDEC capacity and detector throughput."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "nvidia-ml-py>=12",
]

[project.optional-dependencies]
# ONNX Runtime, the production runtime. The [cuda,cudnn] extras bring CUDA 12 and cuDNN 9
# as pip packages, so no system CUDA install is needed.
onnx = [
    "onnxruntime-gpu[cuda,cudnn]>=1.21",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]
# Ultralytics: exports catalog models to ONNX and runs the ``ultralytics`` backend.
# TensorRT is needed only for ``--format engine``.
ultralytics = [
    "ultralytics>=8.3",
    "torch>=2.4",
    "torchvision>=0.19",
    "onnx>=1.16",
    "onnxslim>=0.1.50",
]
tensorrt = [
    "tensorrt>=10",
]

[project.scripts]
camera-bench = "camera_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_bench"]

# PyPI ships CPU-only torch wheels for Windows, so CUDA builds come from the PyTorch index there.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
